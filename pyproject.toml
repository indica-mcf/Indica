[project]
name = "indica"
version = "0.1.25"
description = "INtegrated DIagnostiC Analysis"
license = "GPL-3.0-or-later"
authors = [
    { name = "Marco Sertoli", email = "marco.sertoli@tokamakenergy.com" },
    { name = "Chris MacMackin", email = "chris.macmackin@ukaea.uk" },
    { name = "Michael Gemmell", email = "michael.gemmell@tokamakenergy.com" },
    { name = "Evie Litherland-Smith", email = "evie.litherland-smith@ukaea.uk" }
]
maintainers = [
    { name = "Evie Litherland-Smith", email = "evie.litherland-smith@ukaea.uk" },
    { name = "Michael Gemmell", email = "michael.gemmell@tokamakenergy.com" },
    { name = "Jussi Hakosalo", email = "jussi.hakosalo@tokamakenergy.com" }
]
readme = 'README.md'
requires-python = ">=3.10"
dependencies = [
    "mdsthin",
    "corner>=1.0",
    "pandas==2.2.1",
    "hydra-core>=1.3.1",
    "prov>=1.5.3",
    "netCDF4>=1.5.4",
    "numpy==1.26.4",
    "mpmath>=1.3.0",
    "scipy>=1.9.2",
    "xarray>=2022.1.0",
    "matplotlib>=3.8.0",
    "sal>=1.2.2",
    "emcee>=3.1.4",
    "dime_sampler==1.0.0",
    "flatdict>=4.1.0",
    "bottleneck==1.4.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
    "scikit-optimize>=0.10.2",
    "pyyaml>=6.0.1",
    "Pint>=0.23",
    "GitPython>=3.1.41",
    "periodictable>=1.6.1",
    "freeqdsk>=0.5.0",
]

[project.urls]
repository = "https://github.com/indica-mcf/Indica"

[project.optional-dependencies]
fidasim = [
    "h5py>=3.0",
    "scikit-image>=0.20",
]
aurora = [
    "pyproject-metadata>=0.12.1",
    "scikit_build_core<0.8",
    # Currently won't install due to upstream build-system definition,
    # TODO re-add in the future. See README for now.
    # "aurorafusion==3.0.6",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "click>=8.0.0",
    "corner>=1.0",
    "coverage[toml]>=7.5.1",
    "hypothesis[numpy]>=5.24.2",
    "ipython>=8.24.0",
    "mypy>=0.942",
    "pre-commit>=2.9.2",
    "pytest>=8.3.2",
    "pytest-cov>=2.10.0",
    "pytest-xdist>=2.0.0",
    "types-setuptools>=57.4.14",
]

[tool.uv.build-backend]
module-name = "indica"
module-root = ""

[tool.uv.extra-build-dependencies]
aurorafusion = ["scikit_build_core<0.8"]

[tool.pypi-publisher]
repository="pypi"

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | venv
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
install_types = true
non_interactive = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "numpy.*",
    "prov.*",
    "sal.*",
    "scipy.*",
]
ignore_missing_imports = true
