# This workflow will install Python dependencies and run tests with a variety of Python versions

name: tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
  push:
    paths:
      - .github/workflows/tests.yml
      - indica/**
      - tests/**
      - uv.lock
    branches:
      - main

jobs:
  tests:

    strategy:
      matrix:
        # Won't bother running the other cases until I know the tests pass on my computer
        python-version: [3.12] #, 3.9]
        os: [ubuntu-latest] #, macos-latest]
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft == false

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.11.28"
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --locked --all-extras --dev

    - name: Freeze for aurora
      shell: bash
      run: uv sync --extra aurora --frozen

    - name: Install aurora
      shell: bash
      run: uv pip install --python .venv/bin/python --no-build-isolation aurorafusion

    - name: Test with pytest
      run: uv run pytest --continue-on-collection-errors -v --cov=indica
